<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nirikshak — Network Security Compliance Auditor</title>
<style>
:root{
  --bg:#0B0C0E; --bg-alt:#0D0F11;
  --panel:#121417; --panel-2:#161819;
  --border:#232629; --border-soft:#1B1D20; --border-strong:#33373B;
  --text:#E4E6E8; --text-dim:#93989E; --text-faint:#585D62;
  --blue:#5B93C4; --blue-dim:#233543;
  --amber:#C79A4F; --amber-dim:#3B331F;
  --red:#BD5A52; --red-dim:#3A2422;
  --green:#63A377; --green-dim:#1F2E24;
  --mono:'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;}
::selection{background:var(--blue-dim);color:#fff;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);}
.mono{font-family:var(--mono);}

/* ===== SHELL ===== */
.app{display:grid;grid-template-columns:196px 1fr;grid-template-rows:46px 1fr;height:100vh;}
.sidebar{grid-row:1/3;background:var(--bg-alt);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;}
.sb-brand{padding:16px 18px 14px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:9px;}
.sb-brand .mark{width:20px;height:20px;flex:none;}
.sb-brand .wm{font-weight:600;font-size:12.5px;letter-spacing:.04em;line-height:1.3;}
.sb-brand .wm .f{color:var(--text-dim);font-weight:400;}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;color:var(--text-dim);font-size:12.5px;border-left:2px solid transparent;}
.sb-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.3;flex:none;}
.sb-item:hover{color:var(--text);}
.sb-item.active{color:var(--text);border-left:2px solid var(--blue);background:var(--panel);}
.sb-item .n{margin-left:auto;font-size:10.5px;color:var(--text-faint);font-family:var(--mono);}
.sb-foot{border-top:1px solid var(--border-soft);padding:12px 16px;}
.sb-user{font-size:11.5px;color:var(--text-dim);}
.sb-user .nm{color:var(--text);font-weight:500;}
.sb-quote{font-size:10.5px;color:var(--text-faint);font-style:italic;margin-top:10px;line-height:1.5;}

/* ===== TOP BAR ===== */
.topbar{grid-column:2;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--border-soft);background:var(--bg-alt);}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);padding:6px 10px;color:var(--text-faint);width:300px;}
.searchbar svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none;}
.searchbar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:12px;}
.searchbar input::placeholder{color:var(--text-faint);}
.searchbar .kbd{font-size:9.5px;color:var(--text-faint);border:1px solid var(--border-strong);padding:1px 4px;font-family:var(--mono);}
.topbar-right{display:flex;align-items:center;gap:16px;margin-left:auto;}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
.meta b{color:var(--text-dim);font-weight:500;}
.env{font-size:10px;letter-spacing:.06em;color:var(--green);border:1px solid var(--green-dim);padding:2px 6px;}
.icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;position:relative;}
.icon-btn:hover{color:var(--text);}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;}
.notif-dot{position:absolute;top:4px;right:4px;width:5px;height:5px;background:var(--red);}
.avatar{width:24px;height:24px;background:var(--panel-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--blue);}

/* ===== MAIN ===== */
main{grid-column:2;overflow-y:auto;background:var(--bg);}
.view{padding:24px 30px 60px;max-width:1240px;animation:fadein .1s ease-out;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.eyebrow{font-size:10.5px;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;margin-bottom:4px;}
.view-title{font-size:19px;font-weight:600;letter-spacing:-.005em;}
.view-desc{color:var(--text-dim);font-size:12.5px;margin-top:5px;max-width:600px;}
.flow-strip{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em;}
.flow-strip .on{color:var(--blue);}
.flow-strip span.sep{color:var(--border-strong);}
.hr{height:1px;background:var(--border-soft);border:none;margin:18px 0;}
.section-label{font-size:10.5px;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;margin-bottom:12px;font-weight:500;}
.panel{border:1px solid var(--border);background:var(--panel);}
.panel-head{padding:9px 13px;border-bottom:1px solid var(--border-soft);font-size:11px;letter-spacing:.04em;color:var(--text-dim);}
.panel-body{padding:13px;}
.label{font-size:10px;letter-spacing:.06em;color:var(--text-faint);}
.big-stat{font-family:var(--mono);font-weight:600;}
.tag-word{font-size:11px;font-weight:600;letter-spacing:.02em;}
.tag-word.critical{color:var(--red);} .tag-word.high{color:var(--amber);} .tag-word.medium{color:#B5A25A;} .tag-word.good{color:var(--green);} .tag-word.neutral{color:var(--text-faint);}
.btn{font-size:11.5px;padding:6px 12px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);cursor:pointer;}
.btn:hover{background:#1c1f22;}
.btn:disabled{opacity:.4;cursor:default;}
.btn-primary{background:var(--blue-dim);border-color:#3d5c72;color:#cfe0ec;}
.btn-primary:hover{background:#324a58;}
.btn-quiet{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-quiet:hover{color:var(--text);}
code,.code{font-family:var(--mono);font-size:12px;}
.grid{display:grid;gap:0;}
.row{display:flex;align-items:baseline;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.row .k{color:var(--text-dim);}
.row .v{font-family:var(--mono);}
.input{background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-size:12px;padding:6px 9px;outline:none;}
.input::placeholder{color:var(--text-faint);}
.chip{font-size:11px;padding:3px 9px;border:1px solid var(--border-strong);background:transparent;color:var(--text-dim);cursor:pointer;}
.chip.active{color:var(--blue);border-color:var(--blue);}
.table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);font-weight:500;padding:7px 10px;border-bottom:1px solid var(--border-strong);}
.table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);}
.table tr:hover td{background:var(--panel-2);}

/* posture header block */
.posture-block{display:flex;gap:56px;flex-wrap:wrap;}
.posture-stat .n{font-size:26px;font-weight:600;font-family:var(--mono);}
.posture-stat .l{font-size:11px;color:var(--text-faint);letter-spacing:.04em;margin-top:3px;}

/* bars */
.bar-row{margin-bottom:12px;display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;}
.bar-row .nm{font-size:12px;color:var(--text-dim);}
.bar-track{height:5px;background:var(--panel-2);}
.bar-fill{height:100%;background:var(--blue);}
.bar-row .pct{font-family:var(--mono);font-size:12px;text-align:right;}

/* topology (minimal, no glow) */
.topo-wrap{position:relative;height:400px;border:1px solid var(--border);background:var(--bg-alt);}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;}
.node-box{width:34px;height:34px;border:1px solid var(--border-strong);background:var(--panel);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;}
.node-box svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;}
.node.green .node-box{color:var(--green);} .node.amber .node-box{color:var(--amber);} .node.red .node-box{color:var(--red);} .node.blue .node-box{color:var(--blue);} .node.grey .node-box{color:var(--text-faint);}
.node.selected .node-box{border-color:var(--blue);}
.node-dot{position:absolute;top:-3px;right:-3px;width:6px;height:6px;}
.node-label{font-size:10px;color:var(--text-faint);margin-top:5px;}
.topo-line{position:absolute;background:var(--border-strong);}
.device-overlay{position:absolute;top:12px;left:12px;width:240px;background:var(--panel);border:1px solid var(--border-strong);padding:12px;}

/* code viewer */
.code-line{display:flex;padding:2px 12px;font-family:var(--mono);font-size:11.8px;color:var(--text-dim);white-space:pre;cursor:default;}
.code-line .ln{width:22px;flex:none;color:var(--text-faint);user-select:none;}
.code-line.click{cursor:pointer;}
.code-line.hl{background:var(--amber-dim);color:#e8cfa0;border-left:2px solid var(--amber);padding-left:10px;}
.code-line.hl-red{background:var(--red-dim);color:#e6b6b0;border-left:2px solid var(--red);padding-left:10px;}
.code-line.hl-green{background:var(--green-dim);color:#b3d9c0;border-left:2px solid var(--green);padding-left:10px;}
.code-line.hl.selected, .code-line.hl-red.selected{outline:1px solid var(--blue);}

.flow-vert{font-family:var(--mono);font-size:12px;}
.flow-vert .step{padding:6px 0;color:var(--text-dim);}
.flow-vert .step.strong{color:var(--text);font-weight:600;}
.flow-vert .arrow{color:var(--text-faint);padding-left:2px;}

.confidence-bar{height:3px;background:var(--panel-2);margin-top:5px;}
.confidence-fill{height:100%;background:var(--blue);}

.diff-remove{background:var(--red-dim);color:#e6b6b0;padding:4px 10px;border-left:2px solid var(--red);font-family:var(--mono);font-size:12px;}
.diff-add{background:var(--green-dim);color:#b3d9c0;padding:4px 10px;border-left:2px solid var(--green);font-family:var(--mono);font-size:12px;margin-top:4px;}

.dropzone{border:1px dashed var(--border-strong);background:var(--bg-alt);padding:36px 20px;text-align:center;cursor:pointer;}
.dropzone:hover{border-color:var(--blue);}
.dropzone .dz-title{font-size:12.5px;color:var(--text);margin-bottom:5px;}
.dropzone .dz-sub{font-size:11px;color:var(--text-faint);}
.vendor-badge{font-size:10px;font-family:var(--mono);color:var(--text-dim);border:1px solid var(--border);padding:2px 7px;}
.pipeline{display:flex;justify-content:space-between;position:relative;padding:16px 4px 4px;}
.pipeline::before{content:'';position:absolute;top:20px;left:18px;right:18px;height:1px;background:var(--border-strong);}
.pipe-step{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.pipe-dot{width:8px;height:8px;background:var(--panel-2);border:1px solid var(--border-strong);}
.pipe-dot.done{background:var(--green);border-color:var(--green);}
.pipe-dot.active{background:var(--blue);border-color:var(--blue);}
.pipe-label{font-size:9.5px;color:var(--text-faint);text-align:center;}
.pipe-label.done{color:var(--text-dim);} .pipe-label.active{color:var(--blue);}

.copilot-input{display:flex;align-items:center;gap:10px;border:1px solid var(--border-strong);background:var(--panel);padding:9px 11px;}
.copilot-input input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:12.5px;}
.answer-row{padding:10px 13px;border-bottom:1px solid var(--border-soft);}
.answer-row .k{font-size:10px;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase;}
.answer-row .v{font-size:12.5px;}
.answer-row.mono .v{font-family:var(--mono);}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sb-brand">
      <svg class="mark" viewBox="0 0 20 20" fill="none"><path d="M10 1 18 5.5 18 14.5 10 19 2 14.5 2 5.5Z" stroke="#5B93C4" stroke-width="1.3"/></svg>
      <div class="wm">Nirik<span class="f">shak</span></div>

</div>

<script>
/* ============================================================ DATA ============================================================ */
const NAV = [

const DEVICES = {

  'SRV-FARM-01': {vendor:'—', platform:'Bare metal', state:'DEGRADED', color:'amber', compliance:78, critical:0, high:1, lastChange:'Aug 22', x:12, y:90, icon:'server', label:'Servers'},

};
const RECENT_AUDITS = [

  {name:'CLOUD-GW-01', vendor:'AWS TGW', status:'PASS', color:'good', risk:1.2},
];
const SECURITY_EVENTS = [
  {time:'14:32', text:'CORE-RTR-01 — SSH protocol version downgraded to 1', color:'critical'},
  {time:'11:15', text:'EDGE-FW-01 — ACL policy modified, scope widened', color:'high'},

const FINDINGS = [
  {id:'F-01', sev:'CRITICAL', title:'ACL permits ANY → ANY', asset:'EDGE-FW-01', platform:'PAN-OS', line:184, risk:9.6, riskFrom:2.1, framework:'CIS', control:'ACL_SCOPE', current:'ANY / ANY', required:'Scoped source/destination', raw:'access-list 101 permit ip any any'},

const AUDIT_HISTORY = [
  {id:'NRK-2026-00931', assets:148, date:'Today, 08:00', status:'COMPLETE'},
  {id:'NRK-2026-00918', assets:146, date:'Aug 28', status:'COMPLETE'},
  {id:'NRK-2026-00902', assets:144, date:'Aug 21', status:'COMPLETE'},
];

/* ============================================================ STATE ============================================================ */
const state = {

const PIPE_STAGES=['INGESTING','VENDOR DETECTION','PARSING','SEMANTIC ANALYSIS','COMPLIANCE EVALUATION'];

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderCompliance(compliance) {
  if (!compliance) {
    return `

  const passed = Number(compliance.passed ?? 0);
  const failed = Number(compliance.failed ?? 0);
  const total = Number(compliance.total_assessed ?? 0);
  const framework = escapeHtml(compliance.framework ?? 'CIS');

  const assessments = Array.isArray(compliance.assessments)
    ? compliance.assessments

  return `
    <div class="panel">
      <div class="panel-head">COMPLIANCE ASSESSMENT</div>

        </div>

          <div class="label">PASSED</div>
          <div style="font-size:28px;font-weight:700;margin-top:8px;">
            ${passed}
          </div>
        </div>

        <div style="background:var(--panel);padding:20px;">
          <div class="label">FAILED</div>
          <div style="font-size:28px;font-weight:700;margin-top:8px;">
            ${failed}
          </div>
        </div>

      </div>

      <div style="padding:18px 20px;border-top:1px solid var(--border);">
        <div class="label" style="margin-bottom:12px;">
          CONTROL ASSESSMENTS · ${total}

        ${assessments.map(a => {

          return `
            <div style="
              display:grid;
              grid-template-columns:1.5fr 100px 120px;

              padding:12px 0;
              border-bottom:1px solid var(--border);

              </div>

              <div style="
                font-weight:600;
                color:${isPass ? 'var(--green)' : 'var(--red)'};
              ">
                ${isPass ? 'PASS' : 'FAIL'}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

const VIEWS = {overview:viewOverview, deviceAudit:viewDeviceAudit, findings:viewFindings, remediation:viewRemediation, topology:viewTopology, controls:viewControls, reports:viewReports, parser:viewParser, unknown:viewUnknown, copilot:viewCopilot};
async function runRealAudit(file) {
  const allowedExtensions = ['.conf', '.cfg', '.txt'];
  const fileName = file.name.toLowerCase();

  if (!allowedExtensions.some(ext => fileName.endsWith(ext))) {
    state.auditError = 'Unsupported file type. Please upload a .conf, .cfg, or .txt file.';
    state.auditResult = null;
    state.auditLoading = false;
    renderMain();
    return;
  }

  // Reset previous result
  state.auditResult = null;
  state.auditError = null;
  state.auditLoading = true;
  state.uploadStage = 0;

  renderMain();

  const formData = new FormData();

  formData.append('file', file);
  formData.append('framework', 'CIS');

  try {
    // Pipeline visualization
    state.uploadStage = 1;
    renderMain();

    const response = await fetch(
      'http://127.0.0.1:8000/api/v1/audits/analyze',
      {
        method: 'POST',
        body: formData
      }
    );

    state.uploadStage = 2;
    renderMain();

    if (!response.ok) {
      let message = `Backend request failed (${response.status})`;

      try {
        const errorData = await response.json();

        if (errorData.detail) {
          message = errorData.detail;
        }
      } catch (_) {
        // Ignore JSON parsing failure
      }

      throw new Error(message);
    }

    state.uploadStage = 3;
    renderMain();

    const result = await response.json();

    state.auditResult = result;
    state.auditLoading = false;
    state.uploadStage = PIPE_STAGES.length;

    renderMain();

  } catch (error) {

    console.error('HEXA-FORGE audit error:', error);

    state.auditLoading = false;
    state.auditError =
      error?.message ||
      'Unable to connect to the HEXA-FORGE backend.';

    renderMain();
  }
}

const attachHandlers = {
  overview(){},
  topology(){ bindTopology(); },
  deviceAudit(){
    const dz = document.getElementById('dropzone');
    const input = document.getElementById('configFileInput');

    if (!dz || !input) return;

    // Open file picker when dropzone is clicked
    dz.addEventListener('click', () => {
      if (state.auditLoading) return;
      input.click();
    });

    // Handle selected configuration
    input.addEventListener('change', async (event) => {
      const file = event.target.files?.[0];

      if (!file) return;

      await runRealAudit(file);
    });

    // Drag & drop support
    dz.addEventListener('dragover', (event) => {
      event.preventDefault();
      dz.classList.add('dragover');
    });

    dz.addEventListener('dragleave', () => {
      dz.classList.remove('dragover');
    });

    dz.addEventListener('drop', async (event) => {
      event.preventDefault();
      dz.classList.remove('dragover');

      if (state.auditLoading) return;

      const file = event.dataTransfer.files?.[0];

      if (!file) return;

      await runRealAudit(file);
    });
  },
  parser(){
    document.querySelectorAll('.code-line.click').forEach(l=>{
      l.addEventListener('click',()=>{state.selectedLine=parseInt(l.dataset.line);renderMain();});
    });
  },
  unknown(){
    const m=document.getElementById('btnMarkUnknown'), r=document.getElementById('btnReview');
    if(m) m.addEventListener('click',()=>{state.unknownStatus='VALIDATED';renderMain();});
    if(r) r.addEventListener('click',()=>{state.unknownStatus='VALIDATED';renderMain();});
  },
  findings(){
    document.querySelectorAll('[data-id]').forEach(row=>row.addEventListener('click',()=>{state.selectedFinding=row.dataset.id;renderMain();}));
    document.querySelectorAll('.chip').forEach(chip=>chip.addEventListener('click',()=>{state.findingSevFilter=chip.dataset.sev;renderMain();}));
    const search=document.getElementById('findingSearch');
    if(search){ search.addEventListener('input',()=>{state.findingSearch=search.value; renderMain(); const s=document.getElementById('findingSearch'); s.focus(); s.setSelectionRange(s.value.length,s.value.length);}); }
  },
  remediation(){
    const v=document.getElementById('btnValidate'); if(v) v.addEventListener('click',()=>{state.whatIf={done:true};renderMain();});
    const ap=document.getElementById('btnApprove'); if(ap) ap.addEventListener('click',()=>{ap.textContent='Approved';ap.disabled=true;});
  },
  controls(){
    const search=document.getElementById('controlSearch');
    if(search){ search.addEventListener('input',()=>{state.controlSearch=search.value; renderMain(); const s=document.getElementById('controlSearch'); s.focus(); s.setSelectionRange(s.value.length,s.value.length);}); }
  },
  reports(){ ['btnExportJson','btnExportPdf'].forEach(id=>{const b=document.getElementById(id); if(b) b.addEventListener('click',()=>{const orig=b.textContent;b.textContent='Done';setTimeout(()=>b.textContent=orig,1100);});}); },
  copilot(){ document.getElementById('copilotAsk').addEventListener('click',()=>{document.getElementById('copilotAnswer').innerHTML=copilotAnswer();}); },
};
